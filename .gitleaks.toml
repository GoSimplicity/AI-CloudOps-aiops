# gitleaks 配置（SEC-01A）：在官方默认规则基础上扩展。
# 规则：只对“确定的误报”（占位符/测试夹具）做窄范围 allowlist，每条写明原因；绝不对真实密钥做 allowlist。
title = "AI-CloudOps-aiops gitleaks config"

[extend]
useDefault = true

# 知识库 curl 示例改为引用环境变量 ${AIOPS_API_KEY}（SEC-01A 第三轮 E (c)），默认规则 curl-auth-header 不把变量引用当成密钥，
# 因此删除了原来针对字面占位符 "your-api-key" 的 allowlist：知识库里再出现 your-api-key 也会照常报出。

# 兜底规则（SEC-01A 第三轮 E (b)）：知识库目录下任何 "Bearer <值>" 都报，不限 curl、不限一条命令里第几个头
# （补 curl-auth-header 只报第一个头、非 curl 的 HTTP 头示例不报的缺口，见 review3c second-bearer.log 用例 3/8/9/10）。
# - 捕获组 1 是 secret：可带一个前导引号，值本身到空白或引号/反引号为止（否则 "${AIOPS_API_KEY}" 的收尾引号会被算进 secret）。
# - (?i)：bearer 大小写不敏感；不设 entropy，散文里的 "Bearer token" 也会报，知识库里请写成 ${AIOPS_API_KEY}。
# - 规则内 allowlist 只放行 secret 整体等于 $AIOPS_API_KEY / ${AIOPS_API_KEY} 的情况；
#   不放行 your-api-key 等字面占位符，不按行、不按路径放行。
# 注意：CI 从基准提交读取本文件，引入本规则的 PR 本身仍按基准上的配置扫描，合入后才生效。
[[rules]]
id = "kb-bearer-token"
description = "Bearer token in knowledge-base docs (any context, not only curl)"
regex = '''(?i)\bBearer\s+["'`]?([^\s"'`]+)'''
secretGroup = 1
path = '''^data/knowledge_base/'''
keywords = ["bearer"]

[[rules.allowlists]]
description = "environment variable reference to the shared service key"
regexTarget = "secret"
regexes = ['''^\$\{?AIOPS_API_KEY\}?$''']
