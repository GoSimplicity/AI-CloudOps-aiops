name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      ENV: test
      PYTHON_DOTENV_DISABLED: '1'
      K8S_CONFIG_PATH: /nonexistent
      KUBECONFIG: /nonexistent
      LLM_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --no-deps --disable-pip
      - run: python -m pytest -q
      - run: cp env.example .env
      - run: docker compose config --quiet
        env:
          REDIS_PASSWORD: offline-validation-only
          AIOPS_API_KEY: offline-validation-key-with-32-characters
      - run: docker build -t aiops:verify .
