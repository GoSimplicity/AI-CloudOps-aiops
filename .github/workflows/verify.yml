name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
# 与 gitleaks.yml 相同：PR 的新推送可以取消旧的校验；push 不取消，且 group 带 run_id 使每次 push 运行独立
# （GitHub 会取消同组中“排队中”的旧运行，与 cancel-in-progress 无关）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      ENV: test
      PYTHON_DOTENV_DISABLED: '1'
      K8S_CONFIG_PATH: /nonexistent
      KUBECONFIG: /nonexistent
      LLM_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --no-deps --disable-pip
      - run: pip install ruff==0.15.0
      - run: ruff check app tests
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - name: Verify atomic knowledge refresh with isolated Redis
        run: |
          docker pull redis:7.4.11-alpine
          CLOUDOPS_TEST_GENERATION_GC=true python -m pytest -q tests/unit/test_generation_gc.py
          PYTHONPATH=. python scripts/manual_checks/rag_refresh_redis.py --execute
      - run: cp env.example .env
      - run: docker compose config --quiet
        env:
          REDIS_PASSWORD: offline-validation-only
          AIOPS_API_KEY: offline-validation-key-with-32-characters
      - run: docker build -t aiops:verify .
