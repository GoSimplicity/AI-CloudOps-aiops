[pytest]
testpaths = tests
norecursedirs = scripts .git .venv deploy
asyncio_mode = auto
addopts = --strict-markers
markers =
    unit: 离线单元回归
    integration: 离线 ASGI 组件集成，使用显式依赖替身
    external: 显式选择的真实隔离服务验收
    model: 真实模型调用，可能计费，要求额外开关
filterwarnings =
    ignore::DeprecationWarning:pydantic\._internal\._config
    ignore:The `dict` method is deprecated; use `model_dump` instead:DeprecationWarning
