# 本文件仅用于本仓库本地开发（API、MCP、Prometheus、Redis）。
# 生产部署以后端仓库 GoSimplicity/AI-CloudOps 的 deploy/release/compose.yaml 为准。
# Prometheus v3.2.1 与 Redis 7.4.11-alpine 和发布栈一致；本地 Prometheus 保留期仍为 30 天（发布栈为 15 天）。

services:
  cloudops-platform:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INCLUDE_PREDICTION_MODELS: ${INCLUDE_PREDICTION_MODELS:-false}
    container_name: cloudops-platform
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # MCP服务地址
      - ENV=production
      - AIOPS_API_KEY=${AIOPS_API_KEY:?Set AIOPS_API_KEY}
      - MCP_SERVER_URL=http://cloudops-mcp:9000
      # 预测模型目录。./data/models 通过下面的卷提供；没有 pkl 时走规则兜底。
      - PREDICTION_MODEL_BASE_PATH=/app/data/models
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./deploy/kubernetes:/app/deploy/kubernetes:ro
    depends_on:
      prometheus:
        condition: service_healthy
      redis:
        condition: service_healthy
      cloudops-mcp:
        condition: service_started
    restart: unless-stopped
    networks:
      - aiops-network

  cloudops-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: cloudops-mcp
    ports:
      - "127.0.0.1:9000:9000"
    env_file:
      - .env
    environment:
      # MCP服务配置
      - ENV=production
      - AIOPS_API_KEY=${AIOPS_API_KEY:?Set AIOPS_API_KEY}
      - MCP_SERVER_URL=http://0.0.0.0:9000
      - HOST=0.0.0.0
      - PORT=9000
      # Kubernetes配置
      - K8S_IN_CLUSTER=${K8S_IN_CLUSTER:-false}
      - K8S_CONFIG_PATH=/app/deploy/kubernetes/config
      - K8S_NAMESPACE=${K8S_NAMESPACE:-default}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./deploy/kubernetes:/app/deploy/kubernetes:ro
      # 如果需要访问宿主机的kubeconfig
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aiops-network
    command:
      ["python", "-m", "app.mcp.main", "--host", "0.0.0.0", "--port", "9000"]

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    networks:
      - aiops-network

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0
  #     - OLLAMA_KEEP_ALIVE=24h
  #   restart: unless-stopped
  #   networks:
  #     - aiops-network
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   # 预拉取常用模型
  #   command: >
  #     sh -c "ollama serve &
  #            sleep 10 &&
  #            ollama pull qwen2.5:3b &&
  #            wait"

  redis:
    image: redis:7.4.11-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - aiops-network

volumes:
  prometheus_data:
    driver: local
  ollama_data:
    driver: local
  redis_data:
    driver: local

networks:
  aiops-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
