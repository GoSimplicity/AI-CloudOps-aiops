# 应用基础配置
app:
  env: production
  debug: false
  host: 0.0.0.0
  port: 8080
  log_level: INFO

# Prometheus配置
prometheus:
  host: prometheus:9090
  timeout: 30

# LLM模型配置
llm:
  provider: openai # LLM主提供商（可选：openai, ollama）
  model: Qwen/Qwen2.5-32B-Instruct # 主模型名称（OpenAI时使用）
  task_model: Qwen/Qwen2.5-14B-Instruct # 任务专用模型名称
  temperature: 0.7 # 生成温度，值越大结果越随机
  max_tokens: 2048 # 最大生成Token数
  request_timeout: 360 # LLM请求超时时间（秒）
  ollama_model: qwen2.5:3b # Ollama本地模型名称（备用）
  ollama_base_url: http://ollama:11434/v1 # Ollama API基础URL

# 测试配置
testing:
  skip_llm_tests: false # 是否跳过依赖LLM的测试（true跳过，false不跳过）

# Kubernetes配置
kubernetes:
  in_cluster: false # 是否在K8s集群内部运行
  config_path: /app/deploy/kubernetes/config # K8s配置文件路径（仅in_cluster为false时需要）
  namespace: default # 默认命名空间

# 根因分析配置
rca:
  default_time_range: 30 # 默认分析时间范围（分钟）
  max_time_range: 1440 # 最大分析时间范围（分钟）
  anomaly_threshold: 0.65 # 异常检测阈值
  correlation_threshold: 0.7 # 相关性阈值

  # 指标收集器配置
  metrics:
    step_interval: "1m" # 指标采样步长
    concurrent_limit: 3 # 并发采集限制
    cache_size: 100 # 指标缓存大小
    cache_ttl: 60 # 缓存过期时间（秒）
    anomaly_cache_size: 500 # 异常缓存大小
    thresholds: # 指标阈值配置
      cpu_usage:
        warning: 0.7 # CPU使用率预警阈值
        critical: 0.9 # CPU使用率严重阈值
      memory_usage:
        warning: 0.8 # 内存使用率预警阈值
        critical: 0.95 # 内存使用率严重阈值
      disk_usage:
        warning: 0.75 # 磁盘使用率预警阈值
        critical: 0.9 # 磁盘使用率严重阈值
      error_rate:
        warning: 0.01 # 错误率预警阈值
        critical: 0.05 # 错误率严重阈值
      restart_count:
        warning: 3 # 重启次数预警阈值
        critical: 10 # 重启次数严重阈值
    default_metrics: # 默认监控指标列表
      - container_cpu_usage_seconds_total
      - container_memory_working_set_bytes
      - kube_pod_container_status_restarts_total
      - kube_pod_status_phase
      - node_cpu_seconds_total
      - node_memory_MemFree_bytes
      - kubelet_http_requests_duration_seconds_count
      - kubelet_http_requests_duration_seconds_sum

  # 事件收集器配置
  events:
    default_event_types: ["Warning", "Normal"] # 默认收集的事件类型
    batch_size: 100 # 事件批量处理大小
    max_events_limit: 1000 # 最大事件数量限制
    concurrent_limit: 5 # 并发事件收集限制

  # 日志收集器配置
  logs:
    max_lines: 500 # 单次收集最大日志行数
    error_lines: 200 # 单次收集最大错误日志行数
    concurrent_limit: 5 # 并发日志收集限制
    cache_size: 1000 # 日志缓存大小
    dedup_cache_size: 10000 # 日志去重缓存大小
    max_message_length: 1000 # 单条日志最大长度
    max_stack_trace_lines: 20 # 堆栈跟踪最大行数
    default_error_only: true # 默认只收集错误日志

  # 通用配置
  max_retries: 3 # 最大重试次数
  timeout: 30 # 请求超时时间（秒）

# 预测配置
prediction:
  model_base_path: /app/data/models # 预测模型基础路径
  model_paths: # 各类预测模型及其相关文件路径
    qps:
      model: /app/data/models/qps_prediction_model.pkl # QPS预测模型文件
      scaler: /app/data/models/qps_prediction_scaler.pkl # QPS归一化器文件
      metadata: /app/data/models/qps_prediction_model_metadata.json # QPS模型元数据
    cpu:
      model: /app/data/models/cpu_prediction_model.pkl # CPU预测模型文件
      scaler: /app/data/models/cpu_prediction_scaler.pkl # CPU归一化器文件
      metadata: /app/data/models/cpu_prediction_model_metadata.json # CPU模型元数据
    memory:
      model: /app/data/models/memory_prediction_model.pkl # 内存预测模型文件
      scaler: /app/data/models/memory_prediction_scaler.pkl # 内存归一化器文件
      metadata: /app/data/models/memory_prediction_model_metadata.json # 内存模型元数据
    disk:
      model: /app/data/models/disk_prediction_model.pkl # 磁盘预测模型文件
      scaler: /app/data/models/disk_prediction_scaler.pkl # 磁盘归一化器文件
      metadata: /app/data/models/disk_prediction_model_metadata.json # 磁盘模型元数据

  max_instances: 20 # 最大实例数
  min_instances: 1 # 最小实例数

  prometheus_query: 'rate(nginx_ingress_controller_nginx_process_requests_total{service="ingress-nginx-controller-metrics"}[10m])' # 默认Prometheus查询语句

  default_prediction_hours: 24 # 默认预测时长（小时）
  max_prediction_hours: 168 # 最大预测时长（小时）
  min_prediction_hours: 1 # 最小预测时长（小时）
  default_granularity: hour # 默认预测粒度
  default_target_utilization: 0.7 # 默认目标利用率
  default_sensitivity: 0.8 # 默认灵敏度

  scaling_thresholds: # 扩缩容阈值配置
    qps:
      scale_up: 1000 # QPS扩容阈值
      scale_down: 200 # QPS缩容阈值
      per_instance: 500 # 单实例QPS阈值
    cpu:
      scale_up: 80 # CPU扩容阈值（百分比）
      scale_down: 30 # CPU缩容阈值（百分比）
      optimal: 60 # CPU最优利用率（百分比）
    memory:
      scale_up: 85 # 内存扩容阈值（百分比）
      scale_down: 40 # 内存缩容阈值（百分比）
      optimal: 70 # 内存最优利用率（百分比）
    disk:
      scale_up: 90 # 磁盘扩容阈值（百分比）
      scale_down: 50 # 磁盘缩容阈值（百分比）
      optimal: 75 # 磁盘最优利用率（百分比）

  cooldown_periods: # 扩缩容冷却时间（分钟）
    scale_up: 5 # 扩容冷却时间
    scale_down: 15 # 缩容冷却时间

  cost_analysis: # 成本分析配置
    enabled: true # 是否启用成本分析
    default_pricing: # 默认定价（单位：元/小时）
      instance:
        small: 0.02 # 小型实例价格
        medium: 0.04 # 中型实例价格
        large: 0.08 # 大型实例价格
        xlarge: 0.16 # 超大型实例价格
      cpu_per_core: 0.02 # 每核CPU价格
      memory_per_gb: 0.005 # 每GB内存价格
      disk_per_gb: 0.0001 # 每GB磁盘价格
      bandwidth_per_gb: 0.01 # 每GB带宽价格

  anomaly_detection: # 异常检测配置
    default_method: zscore # 默认异常检测方法
    default_sensitivity: 0.8 # 默认异常检测灵敏度
    enabled_methods: # 启用的异常检测方法
      - zscore
      - iqr
      - mad

# 通知配置
notification:
  enabled: true # 是否启用通知

# Tavily搜索配置
tavily:
  max_results: 5 # Tavily搜索最大返回结果数

# Redis配置 - 用于向量数据缓存和元数据存储
redis:
  host: redis # Redis主机地址
  port: 6379 # Redis端口
  db: 0 # Redis数据库编号
  password: "" # Set REDIS_PASSWORD in the environment
  connection_timeout: 5 # 连接超时时间（秒）
  socket_timeout: 5 # Socket超时时间（秒）
  max_connections: 10 # 最大连接数
  decode_responses: true # 是否自动解码响应为字符串

# 小助手配置
rag:
  vector_db_path: /app/data/vector_db # 向量数据库路径
  collection_name: aiops-assistant # 向量集合名称
  knowledge_base_path: /app/data/knowledge_base # 知识库路径
  chunk_size: 1000 # 文档分块大小
  chunk_overlap: 200 # 分块重叠大小
  top_k: 8 # 检索返回文档数量
  similarity_threshold: 0.15 # 相似度阈值
  openai_embedding_model: Pro/BAAI/bge-m3 # OpenAI嵌入模型名称
  ollama_embedding_model: nomic-embed-text # Ollama嵌入模型名称
  max_context_length: 4000 # 最大上下文长度
  temperature: 0.1 # 生成温度
  timeout: 360 # 智能助手调用超时时间（秒）
  cache_expiry: 3600 # 缓存过期时间（秒）
  max_docs_per_query: 8 # 每次查询最大文档数
  use_enhanced_retrieval: true # 是否使用增强检索
  use_document_compressor: true # 是否使用文档压缩

# MCP配置
mcp:
  server_url: http://cloudops-mcp:9000 # MCP服务端地址
  timeout: 30 # 请求超时时间（秒）
  max_retries: 3 # 最大重试次数
  health_check_interval: 30 # 健康检查间隔（秒）
  write_tools_enabled: false # SEC-33：MCP 写工具总开关，默认关闭；开启后仍需 autofix.repair_enabled 与 allowed_namespaces
  secret_read_enabled: false # SEC-33：MCP list_secrets/get_secret 开关，默认关闭；开启后也只返回 name/type/keys，并受 allowed_namespaces 约束
  kubeconfig_allowed_dir: "" # SEC-46：K8s 读工具 config_path 白名单目录（realpath），默认空=禁用自定义 config_path；不得位于 data/ 或知识库目录下，含 exec/auth-provider 的 kubeconfig 一律拒绝

# 安全配置
security:
  jwt_secret: "" # JWT密钥（生产环境必须设置）
  api_rate_limit: 500 # API访问限制（每分钟请求次数）
  cors_origins: "https://your-frontend-domain.com" # CORS配置

# 开发配置
dev:
  auto_reload: false # 是否启用自动重载
  enable_debug_endpoints: false # 是否启用调试端点

## 巡检配置
inspection:
  enabled: true # 是否启用巡检
  default_profile: basic # 默认规则集：basic 或 extended
  severity_threshold: 0.5 # 严重度阈值(0~1)
  time_window_minutes: 60 # 巡检时间窗口（分钟）
  
  # K8s 采集相关
  k8s:
    include_events: true # 是否采集K8s事件
    include_logs: false # 是否采集Pod日志片段
    log_tail_lines: 200 # 采集日志的尾部行数
  
  # Prometheus 查询相关
  prometheus:
    step: "1m" # 查询步长
    queries_timeout: 10 # 单次查询超时（秒）
  
  # 历史保留
  retention:
    enabled: true # 是否保留历史报告
    max_reports: 200 # 最大保留报告数量
  
  # 简单调度（内部）
  scheduler:
    enabled: false # 生产环境默认关闭内部调度
    cron: "*/30 * * * *" # 调度表达式（粗略用于间隔解析）

# 自动修复执行边界（SEC-26，默认全部关闭 / fail-closed）
autofix:
  auto_execute_enabled: false # true 恢复旧行为：风险评估放行的 low/medium 动作不经确认直接执行（不推荐）
  allowed_namespaces: [] # 允许执行修复动作的命名空间白名单；为空时任何命名空间都不允许执行
  repair_enabled: false # 是否开放 /autofix/repair；开启后也只出计划，执行仍需 /autofix/workflow/confirm
  bootstrap_enabled: false # 是否开放 /autofix/bootstrap（创建 test 命名空间并应用故障演示清单）
