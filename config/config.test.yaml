app:
  debug: true
  host: 0.0.0.0
  log_level: WARNING
  port: 8080
kubernetes:
  config_path: ./deploy/kubernetes/config
  in_cluster: false
  namespace: default
llm:
  max_tokens: 2048
  model: Qwen/Qwen3-14B
  ollama_base_url: http://127.0.0.1:11434/v1
  ollama_model: qwen2.5:3b
  provider: openai
  request_timeout: 360
  task_model: Qwen/Qwen2.5-14B-Instruct
  temperature: 0.7
mcp:
  health_check_interval: 30
  kubeconfig_allowed_dir: ''
  max_retries: 3
  secret_read_enabled: false
  server_url: http://localhost:9000
  timeout: 30
  write_tools_enabled: false
notification:
  enabled: true
prediction:
  max_instances: 20
  min_instances: 1
  model_path: data/models/time_qps_auto_scaling_model.pkl
  prometheus_query: rate(nginx_ingress_controller_nginx_process_requests_total{service="ingress-nginx-controller-metrics"}[10m])
  scaler_path: data/models/time_qps_auto_scaling_scaler.pkl
prometheus:
  host: 127.0.0.1:9090
  timeout: 30
rag:
  max_refresh_files: 128 # 单次刷新文件数预算，范围1..1024
  max_refresh_total_bytes: 33554432 # 单次刷新总字节，默认32MiB，最大256MiB
  cache_expiry: 3600
  chunk_overlap: 200
  chunk_size: 1000
  collection_name: aiops-assistant
  knowledge_base_path: data/knowledge_base
  max_context_length: 4000
  max_docs_per_query: 8
  ollama_embedding_model: nomic-embed-text
  openai_embedding_model: Pro/BAAI/bge-m3
  similarity_threshold: 0.3
  temperature: 0.1
  timeout: 360
  top_k: 8
  use_document_compressor: true
  use_enhanced_retrieval: true
  vector_db_path: data/vector_db
rca:
  anomaly_threshold: 0.65
  correlation_threshold: 0.7
  default_metrics:
  - container_cpu_usage_seconds_total
  - container_memory_working_set_bytes
  - kube_pod_container_status_restarts_total
  - kube_pod_status_phase
  - node_cpu_seconds_total
  - node_memory_MemFree_bytes
  - kubelet_http_requests_duration_seconds_count
  - kubelet_http_requests_duration_seconds_sum
  default_time_range: 30
  max_time_range: 1440
redis:
  connection_timeout: 5
  db: 0
  decode_responses: true
  host: localhost
  max_connections: 10
  password: "" # Set REDIS_PASSWORD in the environment
  port: 6379
  socket_timeout: 5
tavily:
  max_results: 5
testing:
  skip_llm_tests: true

# 巡检配置（测试环境）
inspection:
  enabled: true
  default_profile: basic
  severity_threshold: 0.5
  time_window_minutes: 30
  k8s:
    include_events: true
    include_logs: false
    log_tail_lines: 100
  prometheus:
    step: "1m"
    queries_timeout: 10
  retention:
    enabled: true
    max_reports: 50
  scheduler:
    enabled: false
    cron: "*/15 * * * *"

# 自动修复执行边界（SEC-26，默认全部关闭 / fail-closed）
autofix:
  auto_execute_enabled: false # true 恢复旧行为：风险评估放行的 low/medium 动作不经确认直接执行（不推荐）
  allowed_namespaces: [] # 允许执行修复动作的命名空间白名单；为空时任何命名空间都不允许执行
  repair_enabled: false # 是否开放 /autofix/repair；开启后也只出计划，执行仍需 /autofix/workflow/confirm
  bootstrap_enabled: false # 是否开放 /autofix/bootstrap（创建 test 命名空间并应用故障演示清单）
